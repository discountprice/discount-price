
name: Generate SEO Pages and Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "index.html"
      - ".github/workflows/generate-seo-pages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SEO pages and sitemap
        run: node scripts/generate-seo-pages.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores blog sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Update SEO pages and sitemap"
          git push
