
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Price Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;font-family:Arial;color:white;padding:20px}
.login{width:100%;max-width:400px;background:#1c293b;padding:35px;border-radius:16px}
h1{text-align:center;color:#38d996}
p{text-align:center;color:#aab5c5}
input,button{width:100%;padding:14px;margin-top:15px;border-radius:8px;font-size:15px}
input{background:#101827;color:white;border:1px solid #42516a}
button{background:#16a875;color:white;border:0;font-weight:bold;cursor:pointer}
#message{text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="login">
<h1>Discount Price</h1>
<p>Admin Portal Login</p>
<form id="loginForm">
<input type="email" id="email" placeholder="Admin Email" required>
<input type="password" id="password" placeholder="Password" required>
<button id="loginBtn">Login to Dashboard</button>
</form>
<div id="message"></div>
</div>
<script>
const client = window.supabase.createClient(
"https://eyaukiovgugmiyytybdg.supabase.co",
"sb_publishable_qahiC18UeUqc6qVosbenCw_zKmQ7vb1"
);
document.getElementById("loginForm").addEventListener("submit",async e=>{
e.preventDefault();
const message=document.getElementById("message");
const btn=document.getElementById("loginBtn");
btn.disabled=true;
message.textContent="Please wait...";
const {error}=await client.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
message.textContent=error?error.message:"Login successful! Admin authenticated.";
message.style.color=error?"#ff7777":"#38d996";
btn.disabled=false;
});
</script>
</body>
</html>
